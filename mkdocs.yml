site_name: AI Drug Discovery Lab
site_url: https://luzuokun.github.io/ai-drug-discovery-lab/
site_description: One-person HITL drug discovery workbench — you are the PI; the system is a gated virtual lab.
site_author: Luzuokun

repo_name: Luzuokun/ai-drug-discovery-lab
repo_url: https://github.com/Luzuokun/ai-drug-discovery-lab
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 AI Drug Discovery Lab

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: blue grey
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: blue grey
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Source Sans 3
    code: IBM Plex Mono

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
          site_name: AI 药物发现实验室
          nav:
            - 首页: index.md
            - 怎么工作: how-it-works.md
            - 工作台:
                - stations/index.md
                - 文献 Research: stations/research.md
                - 生成 Chemistry:
                    - stations/chemistry.md
                    - REINVENT4:
                        - molecular-generation/reinvent4/index.md
                        - "01 安装与首个分子": molecular-generation/reinvent4/01-installation-first-molecule.md
                        - "02 Prior 实践": molecular-generation/reinvent4/02-priors-in-practice.md
                        - "03 评分函数": molecular-generation/reinvent4/03-scoring-function.md
                        - "04 强化学习": molecular-generation/reinvent4/04-reinforcement-learning.md
                        - "05 多样性过滤器": molecular-generation/reinvent4/05-diversity-filter.md
                        - "06 课程学习": molecular-generation/reinvent4/06-curriculum-learning.md
                        - "07 迁移学习": molecular-generation/reinvent4/07-transfer-learning.md
                        - "08 对接引导设计": molecular-generation/reinvent4/08-docking-guided-design.md
                        - "09 扩规模与监控": molecular-generation/reinvent4/09-scaling-and-monitoring.md
                        - "10 消融与超参数": molecular-generation/reinvent4/10-ablations-and-hyperparameters.md
                        - "11 案例：BRAF": molecular-generation/reinvent4/11-case-study-braf.md
                        - "12 故障排查附录": molecular-generation/reinvent4/12-troubleshooting-appendix.md
                - 结构 Structure:
                    - stations/structure.md
                    - AutoDock Vina: docking/autodock-vina.md
                    - Gnina: docking/gnina.md
                - 动力学 Dynamics:
                    - stations/dynamics.md
                    - GROMACS: molecular-dynamics/gromacs.md
                - 批判 Critic: stations/critic.md
                - 你 You（PI）: stations/you.md
            - 战役案例:
                - campaigns/index.md
                - BRAF 课内案例: molecular-generation/reinvent4/11-case-study-braf.md
            - 安装与环境: getting-started/index.md
            - 附录:
                - appendix/index.md
                - 蛋白质工具（教材规划）:
                    - protein-ai/index.md
                    - ESM2: protein-ai/esm2.md
                    - ESMFold: protein-ai/esmfold.md
                    - ProteinMPNN: protein-ai/proteinmpnn.md
                    - LigandMPNN: protein-ai/ligandmpnn.md
                    - RFdiffusion: protein-ai/rfdiffusion.md
                - 其他生成器（未接线）:
                    - DrugEx: molecular-generation/drugex.md
                    - MolGPT: molecular-generation/molgpt.md
                    - GraphGA: molecular-generation/graphga.md
                    - 扩散模型: molecular-generation/diffusion.md
                - Smina: docking/smina.md
                - Amber: molecular-dynamics/amber.md
                - RDKit:
                    - rdkit/index.md
                    - 指纹: rdkit/fingerprint.md
                    - 描述符: rdkit/descriptor.md
                    - 骨架: rdkit/scaffold.md
                - Python 工作流:
                    - python-workflow/index.md
                    - 脚本: python-workflow/scripts.md
                    - 自动化: python-workflow/automation.md
                - 论文项目壳:
                    - papers/index.md
                    - BRAF 项目: papers/braf-project.md
                    - CDK1 项目: papers/cdk1-project.md
                - 速查表: cheat-sheets/index.md
                - 资源: resources/index.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - How it works: how-it-works.md
  - Workbench:
      - stations/index.md
      - Research: stations/research.md
      - Chemistry:
          - stations/chemistry.md
          - REINVENT4:
              - molecular-generation/reinvent4/index.md
              - "01 Installation & First Molecule": molecular-generation/reinvent4/01-installation-first-molecule.md
              - "02 Priors in Practice": molecular-generation/reinvent4/02-priors-in-practice.md
              - "03 Scoring Function": molecular-generation/reinvent4/03-scoring-function.md
              - "04 Reinforcement Learning": molecular-generation/reinvent4/04-reinforcement-learning.md
              - "05 Diversity Filter": molecular-generation/reinvent4/05-diversity-filter.md
              - "06 Curriculum Learning": molecular-generation/reinvent4/06-curriculum-learning.md
              - "07 Transfer Learning": molecular-generation/reinvent4/07-transfer-learning.md
              - "08 Docking-Guided Design": molecular-generation/reinvent4/08-docking-guided-design.md
              - "09 Scaling & Monitoring": molecular-generation/reinvent4/09-scaling-and-monitoring.md
              - "10 Ablations & Hyperparameters": molecular-generation/reinvent4/10-ablations-and-hyperparameters.md
              - "11 Case Study: BRAF": molecular-generation/reinvent4/11-case-study-braf.md
              - "12 Troubleshooting Appendix": molecular-generation/reinvent4/12-troubleshooting-appendix.md
      - Structure:
          - stations/structure.md
          - AutoDock Vina: docking/autodock-vina.md
          - Gnina: docking/gnina.md
      - Dynamics:
          - stations/dynamics.md
          - GROMACS: molecular-dynamics/gromacs.md
      - Critic: stations/critic.md
      - You (PI): stations/you.md
  - Campaigns:
      - campaigns/index.md
      - BRAF course case: molecular-generation/reinvent4/11-case-study-braf.md
  - Install & environment: getting-started/index.md
  - Appendix:
      - appendix/index.md
      - Protein tools (planned):
          - protein-ai/index.md
          - ESM2: protein-ai/esm2.md
          - ESMFold: protein-ai/esmfold.md
          - ProteinMPNN: protein-ai/proteinmpnn.md
          - LigandMPNN: protein-ai/ligandmpnn.md
          - RFdiffusion: protein-ai/rfdiffusion.md
      - Other generators (unwired):
          - DrugEx: molecular-generation/drugex.md
          - MolGPT: molecular-generation/molgpt.md
          - GraphGA: molecular-generation/graphga.md
          - Diffusion Models: molecular-generation/diffusion.md
      - Smina: docking/smina.md
      - Amber: molecular-dynamics/amber.md
      - RDKit:
          - rdkit/index.md
          - Fingerprint: rdkit/fingerprint.md
          - Descriptor: rdkit/descriptor.md
          - Scaffold: rdkit/scaffold.md
      - Python Workflow:
          - python-workflow/index.md
          - Scripts: python-workflow/scripts.md
