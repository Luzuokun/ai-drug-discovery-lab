      - Paper stubs:
          - papers/index.md
          - BRAF Project: papers/braf-project.md
          - CDK1 Project: papers/cdk1-project.md
      - Cheat Sheets: cheat-sheets/index.md
      - Resources: resources/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Luzuokun/ai-drug-discovery-lab
